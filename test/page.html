<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/tabulator.css" />
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <div id="toolbar">
        <div class="toolbar-left">
            <button id="btn-load"><span class="btn-label">Load</span></button>
            <button id="btn-save" disabled><span class="btn-label">Save</span></button>
            <button id="btn-undo" disabled><span class="btn-label">Undo</span></button>
            <button id="btn-record" aria-pressed="false" disabled><span class="btn-label">Record</span></button>
            <button id="btn-play" disabled><span class="btn-label">Play</span></button>
            <button id="btn-playall" disabled><span class="btn-label">Play All</span></button>
            <button id="btn-clean" disabled><span class="btn-label">Clean</span></button>
        </div>
        <div class="toolbar-right">
            <button id="btn-setup"><span class="btn-label">Setup</span></button>
        </div>
    </div>
    <div id="grid" style="height: 420px"></div>
    <pre id="out">running</pre>
    <script>
        // Surface anything that stops the module before it can report.
        const show = (msg) => { document.getElementById("out").textContent = msg; };
        window.addEventListener("error", (e) => show(`ERROR ${e.message} @ ${e.filename}:${e.lineno}`));
        // Append rather than overwrite: the results are worth keeping.
        window.addEventListener("unhandledrejection", (e) => {
            const out = document.getElementById("out");
            out.textContent = `${out.textContent}\nREJECTION ${e.reason}`;
        });
    </script>
    <script type="module" src="/test.mjs"></script>
</body>
</html>
